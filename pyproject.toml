[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touchstone"
version = "0.1.0"
description = "Ghost detector — finds drift between declared and actual system state"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "sqlglot==30.29.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "httpx==0.28.0",
    "openai>=1.54.0",
    "urllib3>=2.0.0",
    "pyyaml>=6.0",
    "boto3==1.35.68",
    "packaging==24.2",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "hypothesis==6.119.3",
    "pytest-cov==6.0.0",
]

[project.scripts]
touchstone = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*", "agents*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
